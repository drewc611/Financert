services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # The frontend service below is the only browser origin in this stack.
      # A wildcard here would undo the allowlist the app defaults to, and would
      # also silently disable credentialed requests -- browsers reject
      # wildcard-plus-credentials. Add your real origin when deploying.
      FINANCERT_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      FINANCERT_DATABASE_URL: "sqlite:////data/financert.db"
      # Uncomment to require a bearer token on every /api/portfolio* route.
      # Generate one with: openssl rand -hex 32
      # FINANCERT_API_TOKEN: "replace-me"
    volumes:
      - financert-db:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Not in the default stack -- start it with `docker compose --profile mcp up`
  # -- because the dashboard does not use it. It is here so the hosted
  # transport can be exercised the way it will really run, which is the only
  # way to catch a Host/Origin misconfiguration before a reviewer does.
  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    profiles: ["mcp"]
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      # A hosted deployment replaces this with its own public HTTPS origin.
      # Leaving it unset is not a shortcut: the server then trusts localhost
      # only and refuses everything arriving through a proxy.
      FINANCERT_MCP_ALLOWED_ORIGINS: "http://localhost:8081,http://127.0.0.1:8081"

volumes:
  financert-db:
