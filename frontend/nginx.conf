server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers, set on every response. `always` so they also ride on
  # 304s and error pages. They are declared here at server level and no
  # location below adds its own: an add_header inside a location replaces the
  # inherited set instead of extending it.
  #
  # The Content-Security-Policy is the one vite.config.js writes into
  # index.html as a <meta> tag, plus frame-ancestors, which only works as a
  # header. Keep the two in step (src/lib/cspParity.test.js checks it).
  # __API_ORIGIN__ is replaced at image build time by frontend/Dockerfile with
  # the origin of VITE_API_BASE, the same value vite.config.js uses, so the
  # policy and the bundle cannot disagree about where the API is.
  #
  # style-src keeps 'unsafe-inline' for the same reason as in vite.config.js:
  # the charts set style attributes on the elements they render.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' __API_ORIGIN__; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # No Strict-Transport-Security here: this server speaks plain HTTP on :80 and
  # a browser ignores the header there. Send it from whatever terminates TLS.

  location / {
    try_files $uri $uri/ /index.html;
  }
}
