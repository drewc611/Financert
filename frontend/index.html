<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the standalone app can paint under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Financert — how the top 1% actually hold their wealth</title>
    <meta
      name="description"
      content="Compare your portfolio against how American households actually hold their wealth, by wealth percentile, using Federal Reserve data."
    />

    <!-- Installable-app wiring. The `lang`/`dir` on <html> are only the
         build-time default; src/i18n rewrites both once the locale is known. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2a78d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1620" media="(prefers-color-scheme: dark)" />
    <!-- iOS does not read the manifest for these; it has its own meta tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Financert" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='7' y='17' width='4' height='9' rx='1.5' fill='white'/%3E%3Crect x='14' y='12' width='4' height='14' rx='1.5' fill='white'/%3E%3Crect x='21' y='6' width='4' height='20' rx='1.5' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
