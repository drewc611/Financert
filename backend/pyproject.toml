[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # E501 is the formatter's job, not the linter's.
  "E501",
  # B008 forbids function calls in argument defaults, but `db: Session =
  # Depends(get_db)` is exactly how FastAPI declares dependencies. The rule
  # cannot be satisfied without abandoning the framework's idiom.
  "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
