[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length is the formatter's job, not the linter's
    "B008", # `Depends(...)`/`Query(...)` in defaults is the FastAPI idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
