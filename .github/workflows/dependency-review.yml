name: Dependency review

# Catches a vulnerable dependency at the point it is proposed, which is the
# cheapest moment to say no. Dependabot handles what is already merged; this
# handles what is about to be.
on:
  pull_request:
    branches: [main]

# Read-only. This job needs nothing else, and the default token scope is
# broader than that.
permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Low-severity advisories in a dev-only dependency would block every
          # PR without telling anyone anything. Moderate is the level where a
          # human should actually look.
          fail-on-severity: moderate
          # This repo is MIT; a copyleft dependency pulled in by accident is
          # worth catching while it is still one line of a diff.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0
