name: Data refresh

# The Fed publishes the DFA about ten weeks after each quarter ends, and
# bringing it forward meant someone remembering to run fetch_dfa.py. This runs
# it weekly and opens a pull request when the published archive differs from
# the committed snapshot (BACKLOG F61) -- which is also the alert that a new
# quarter exists (F62), in the form of something reviewable rather than a
# notification someone still has to act on.
#
# A pull request rather than a commit to main, on purpose: a refresh changes
# every number on the site, and the diff is the review.
on:
  schedule:
    - cron: "23 7 * * 3"
  workflow_dispatch:

# Nothing by default; the one job below asks for what it needs.
permissions: {}

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # contents: write pushes the proposal branch, pull-requests: write opens
    # and closes the pull requests. Nothing else is granted.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Record what the snapshot was
        id: before
        run: python backend/tools/snapshot_summary.py >> "$GITHUB_OUTPUT"

      # The refresh overwrites these in place, and the interesting question is
      # what *changed* -- including whether the Fed restated a quarter that is
      # already on the site (BACKLOG F63). Keep the old files to compare with.
      - name: Keep the snapshot being replaced
        run: cp -r backend/data /tmp/snapshot-before

      # fetch_dfa.py fails the run rather than writing anything if the taxonomy
      # stops reconciling against the Fed's published totals on either side of
      # the balance sheet, so a bad refresh never reaches a pull request.
      - name: Refresh
        working-directory: backend
        run: |
          python fetch_dfa.py
          python tools/build_fallback.py

      # The comparison is the archive's checksum, not `git diff`. Every run
      # rewrites `retrieved_at` -- which is the point of that field, it records
      # when the source was last checked -- so a diff-based test would open an
      # identical pull request every week. The checksum is exactly what F7 put
      # in the snapshot: it tells a refresh that changes numbers from one that
      # does not.
      - name: Record what it is now
        id: after
        run: python backend/tools/snapshot_summary.py >> "$GITHUB_OUTPUT"

      - name: What changed
        if: steps.after.outputs.checksum != steps.before.outputs.checksum
        run: |
          python backend/tools/snapshot_diff.py \
            /tmp/snapshot-before/dfa_snapshot.json backend/data/dfa_snapshot.json \
            | tee /tmp/refresh-diff.txt

      - name: Nothing to do
        if: steps.after.outputs.checksum == steps.before.outputs.checksum
        env:
          CHECKSUM: ${{ steps.after.outputs.checksum }}
        run: |
          echo "The published archive is unchanged (sha256 starts $CHECKSUM)."
          git checkout -- backend/data frontend/src/lib/fallbackData.js

      - name: Open a pull request
        if: steps.after.outputs.checksum != steps.before.outputs.checksum
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_PERIOD: ${{ steps.before.outputs.period }}
          AFTER_PERIOD: ${{ steps.after.outputs.period }}
          CHECKSUM: ${{ steps.after.outputs.checksum }}
        run: |
          set -euo pipefail
          # One branch per archive, so a plain push always works: no branch is
          # ever rewritten. The same archive seen again next week has its
          # branch already, which means its pull request already exists.
          BRANCH="data/refresh-${CHECKSUM:0:12}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "$BRANCH already exists; a pull request for this archive was opened earlier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add backend/data frontend/src/lib/fallbackData.js
          git commit -m "Refresh the DFA snapshot ($BEFORE_PERIOD -> $AFTER_PERIOD)"
          git push origin "$BRANCH"

          NEW_PR="$(gh pr create --head "$BRANCH" --base main \
            --title "Data refresh: $AFTER_PERIOD" \
            --body "$(cat <<BODY
          The Fed's published archive no longer matches the committed snapshot.

          | | |
          |---|---|
          | Latest period | \`$BEFORE_PERIOD\` → \`$AFTER_PERIOD\` |
          | Archive sha256 | starts \`$CHECKSUM\` |

          \`\`\`
          $(cat /tmp/refresh-diff.txt)
          \`\`\`

          A **revision** line above means the Fed restated a quarter that is
          already on the site: those are numbers a reader has been shown
          before, and they are the part of this diff worth reading twice.

          Every number on the site comes from these files, so the diff is the
          review. \`fetch_dfa.py\` reconciles the taxonomy against the Fed's own
          published totals on both sides of the balance sheet and fails rather
          than writing when it does not, so this got at least that far.

          The golden-file test pins the *parser*, not the data, so a refresh
          does not touch it — CI failing here would mean the parse changed, not
          the quarter.

          Opened by [data-refresh.yml](.github/workflows/data-refresh.yml).
          BODY
          )")"

          # An older refresh proposal is out of date the moment a newer archive
          # exists, so close it rather than leave two competing diffs open.
          export BRANCH
          for old in $(gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("data/refresh")) | select(.headRefName != env.BRANCH) | .number'); do
            gh pr close "$old" --delete-branch --comment "Superseded by $NEW_PR"
          done
