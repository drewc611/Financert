name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:

# Declared explicitly because the default is whatever the repository setting
# says, and that can be read/write on every scope. Nothing here needs to
# write: these jobs check out the code, lint it, test it and build it.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        # Coverage on the app package only -- the tests' own coverage is not a
        # number anyone acts on. It prints a per-file table; no threshold,
        # because a number that fails the build is a decision for whoever owns
        # the project, not a default.
        run: pytest --cov=app --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        # Flat config (eslint.config.js): the files it lints are declared in
        # the config, so there is no --ext to pass.
        run: npx eslint .
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
