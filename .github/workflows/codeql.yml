# CodeQL static analysis.
#
# This began as GitHub's template, which ships with every entry in the language
# matrix commented out. Left that way the matrix expands to zero jobs and the
# run fails having scanned nothing -- which it did, seventeen times, while
# looking from the outside like a working security check. Worse than no scanner
# at all. The matrix below names what the repository actually contains.
name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "22 17 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything here is interpreted, so build-mode is "none" throughout;
          # there is nothing to compile and no manual build step to write.
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # The workflows themselves. This repo's automation writes files from
          # repository content and runs with `pages: write`, which is exactly
          # the shape of thing this pack is built to catch.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
